name: Deploy Backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/var/apps/backend/heatlh_checker_backend
            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -z "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              else
                cd "$APP_DIR"
                git init
                git remote remove origin || true
                git remote add origin https://github.com/${{ github.repository }}.git
              fi
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            touch .env
            if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
              sed -i '/^TELEGRAM_BOT_TOKEN=/d' .env
              echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            fi
            if [ -n "${{ secrets.CHAT_ID }}" ]; then
              sed -i '/^CHAT_ID=/d' .env
              echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env
            fi

            python3 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            bash ops/install-systemd.sh
